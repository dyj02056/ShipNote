name: ci

# main 푸시와 PR마다 타입 검사, 테스트, 빌드, 패키지 구성을 확인한다.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run web:build
      - name: 패키지 구성 확인
        run: npm pack --dry-run --ignore-scripts
