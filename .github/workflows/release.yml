name: release-docs

# v로 시작하는 태그를 푸시하면 릴리스 문서를 만들어 GitHub Release에 올린다.
# 저장소 시크릿 SHIPNOTE_SIGNING_KEY(shipnote keygen으로 만든 비밀키 PEM)가 있으면 서명한다.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 직전 태그를 찾으려면 전체 이력이 필요하다
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: 서명 키 준비
        env:
          SIGNING_KEY: ${{ secrets.SHIPNOTE_SIGNING_KEY }}
        run: |
          mkdir -p out
          if [ -n "$SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/shipnote.key"
            openssl pkey -in "$RUNNER_TEMP/shipnote.key" -pubout -out out/shipnote.pub
            echo "SIGN_ARGS=--key $RUNNER_TEMP/shipnote.key" >> "$GITHUB_ENV"
            echo "VERIFY_ARGS=--pubkey out/shipnote.pub" >> "$GITHUB_ENV"
          else
            echo "::warning::SHIPNOTE_SIGNING_KEY가 없어 서명 없이 만듭니다"
          fi
          echo "ZIP=out/shipnote-$(printf '%s' "$GITHUB_REF_NAME" | tr / '~').zip" >> "$GITHUB_ENV"

      - name: 릴리스 문서 생성
        run: node src/cli.ts release "$GITHUB_REF_NAME" --repo . --out out --db out/shipnote.db $SIGN_ARGS

      - name: 패키지 재검증
        run: node src/cli.ts verify "$ZIP" $VERIFY_ARGS

      - name: 릴리스 본문 만들기
        run: |
          unzip -p "$ZIP" RELEASE_NOTES.md > out/notes.md
          {
            echo
            echo '---'
            echo
            echo "**전달 패키지** \`$(basename "$ZIP")\`"
            echo
            echo "- SHA-256: \`$(sha256sum "$ZIP" | cut -d' ' -f1)\`"
            if [ -f out/shipnote.pub ]; then
              echo "- 서명: Ed25519, 공개키 \`shipnote.pub\` 첨부"
              echo "- 확인: \`shipnote verify $(basename "$ZIP") --pubkey shipnote.pub\`"
            else
              echo "- 서명: 없음"
            fi
          } >> out/notes.md

      - name: GitHub Release에 첨부
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file out/notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file out/notes.md
          fi
          files=("$ZIP")
          [ -f out/shipnote.pub ] && files+=(out/shipnote.pub)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      - name: 비밀키 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/shipnote.key"
